name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to finish or retry
        required: true
        type: string

concurrency:
  group: darniri-release-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Check Homebrew credentials before publication
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: gh api repos/stearz/homebrew-tap --silent

      - name: Validate release version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          test "$RELEASE_TAG" = "v$VERSION"
          test "$(cat VERSION)" = "$VERSION"
          test -s CHANGELOG.md

      - name: Build and package ARM64 executable and app
        run: ./Scripts/package-release.sh

      - name: Compute SHA256
        id: sha256
        run: |
          echo "value=$(shasum -a 256 dist/Darniri-arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "app=$(shasum -a 256 dist/Darniri-arm64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Attach archives to the Release Please release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/Darniri-arm64.tar.gz dist/Darniri-arm64.zip --clobber

      - name: Update Homebrew formula and cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ env.RELEASE_TAG }}
          SHA256: ${{ steps.sha256.outputs.value }}
          APP_SHA256: ${{ steps.sha256.outputs.app }}
        run: |
          git clone https://x-access-token:${TAP_TOKEN}@github.com/stearz/homebrew-tap.git
          cd homebrew-tap

          cat > Formula/darniri.rb << 'FORMULA'
          class Darniri < Formula
            desc "Darwin/macOS implementation of a Niri-style scrolling-column window manager"
            homepage "https://github.com/stearz/Darniri"
            license "GPL-2.0-only"
            version "RELEASE_VERSION"

            url "https://github.com/stearz/Darniri/releases/download/RELEASE_TAG/Darniri-arm64.tar.gz"
            sha256 "RELEASE_SHA256"

            head "https://github.com/stearz/Darniri.git", branch: "main"

            depends_on macos: :sequoia
            depends_on arch: :arm64
            depends_on xcode: :build if build.head?

            def install
              if build.head?
                system "swift", "build",
                  "--configuration", "release",
                  "--disable-sandbox",
                  "--product", "Darniri"
                bin.install ".build/release/Darniri"
              else
                bin.install "Darniri"
              end
            end

            test do
              assert_path_exists bin/"Darniri"
            end
          end
          FORMULA

          VERSION_NUM="${VERSION#v}"
          sed -i '' "s|RELEASE_VERSION|${VERSION_NUM}|g" Formula/darniri.rb
          sed -i '' "s|RELEASE_TAG|${VERSION}|g" Formula/darniri.rb
          sed -i '' "s|RELEASE_SHA256|${SHA256}|g" Formula/darniri.rb

          mkdir -p Casks
          cat > Casks/darniri.rb << 'CASK'
          cask "darniri" do
            version "RELEASE_VERSION"
            sha256 "RELEASE_SHA256"

            url "https://github.com/stearz/Darniri/releases/download/RELEASE_TAG/Darniri-arm64.zip"
            name "Darniri"
            desc "Scrolling-column window manager for macOS"
            homepage "https://github.com/stearz/Darniri"

            depends_on macos: ">= :sequoia"
            depends_on arch: :arm64

            app "Darniri.app"
            binary "#{appdir}/Darniri.app/Contents/Resources/darniri", target: "Darniri"
          end
          CASK
          sed -i '' "s|RELEASE_VERSION|${VERSION_NUM}|g" Casks/darniri.rb
          sed -i '' "s|RELEASE_TAG|${VERSION}|g" Casks/darniri.rb
          sed -i '' "s|RELEASE_SHA256|${APP_SHA256}|g" Casks/darniri.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/darniri.rb Casks/darniri.rb
          if git diff --cached --quiet; then
            echo "Homebrew definitions already match this release."
            exit 0
          fi
          git commit -m "darniri ${VERSION_NUM}"
          git push

      - name: Verify published archives and Homebrew update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERIFY_DIR=$(mktemp -d)
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          gh release download "$RELEASE_TAG" \
            --pattern Darniri-arm64.tar.gz --pattern Darniri-arm64.zip --dir "$VERIFY_DIR"
          cmp dist/Darniri-arm64.tar.gz "$VERIFY_DIR/Darniri-arm64.tar.gz"
          cmp dist/Darniri-arm64.zip "$VERIFY_DIR/Darniri-arm64.zip"
          git -C homebrew-tap fetch origin main
          test "$(git -C homebrew-tap rev-parse HEAD)" = "$(git -C homebrew-tap rev-parse origin/main)"
          echo "Release $RELEASE_TAG: both archives and Homebrew formula/cask verified." >> "$GITHUB_STEP_SUMMARY"
