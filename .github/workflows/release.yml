name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Validate release version and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          test "$RELEASE_TAG" = "v$VERSION"
          test -s "docs/releases/$VERSION.md"
          echo "RELEASE_NOTES=docs/releases/$VERSION.md" >> "$GITHUB_ENV"

      - name: Build and package ARM64 executable
        run: ./Scripts/package-release.sh

      - name: Compute SHA256
        id: sha256
        run: echo "value=$(shasum -a 256 dist/Darniri-arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Darniri-arm64.tar.gz
          body_path: ${{ env.RELEASE_NOTES }}
          fail_on_unmatched_files: true

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          SHA256: ${{ steps.sha256.outputs.value }}
        run: |
          git clone https://x-access-token:${TAP_TOKEN}@github.com/stearz/homebrew-tap.git
          cd homebrew-tap

          cat > Formula/darniri.rb << 'FORMULA'
          class Darniri < Formula
            desc "Darwin/macOS implementation of a Niri-style scrolling-column window manager"
            homepage "https://github.com/stearz/Darniri"
            license "GPL-2.0-only"
            version "RELEASE_VERSION"

            url "https://github.com/stearz/Darniri/releases/download/RELEASE_TAG/Darniri-arm64.tar.gz"
            sha256 "RELEASE_SHA256"

            head "https://github.com/stearz/Darniri.git", branch: "main"

            depends_on macos: :sequoia
            depends_on arch: :arm64
            depends_on xcode: :build if build.head?

            def install
              if build.head?
                system "swift", "build",
                  "--configuration", "release",
                  "--disable-sandbox",
                  "--product", "Darniri"
                bin.install ".build/release/Darniri"
              else
                bin.install "Darniri"
              end
            end

            test do
              assert_path_exists bin/"Darniri"
            end
          end
          FORMULA

          VERSION_NUM="${VERSION#v}"
          sed -i '' "s|RELEASE_VERSION|${VERSION_NUM}|g" Formula/darniri.rb
          sed -i '' "s|RELEASE_TAG|${VERSION}|g" Formula/darniri.rb
          sed -i '' "s|RELEASE_SHA256|${SHA256}|g" Formula/darniri.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/darniri.rb
          git commit -m "darniri ${VERSION_NUM}"
          git push
