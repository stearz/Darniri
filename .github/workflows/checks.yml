name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to verify for publication
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install pinned check tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./Scripts/install-check-tools.sh
          echo "$PWD/.build/check-tools" >> "$GITHUB_PATH"
      - name: Check formatting, lint, build, and tests
        run: make verify
      - name: Verify ARM64 release packaging
        run: ./Scripts/package-release.sh
